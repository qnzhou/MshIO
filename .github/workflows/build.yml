name: build and test

on: [pull_request]

jobs:
  build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: install Python test dependencies
      run: python -m pip install "numpy>=1.25"

    - name: build and run
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DMSHIO_BUILD_TESTS=On -DMSHIO_BUILD_EXAMPLES=On -DMSHIO_PYTHON=On
        make -j
        ctest --output-on-failure

  build-MacOS:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: build and run
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DMSHIO_BUILD_TESTS=On -DMSHIO_BUILD_EXAMPLES=On
        make -j
        ctest

  build-Windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: build and run
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_GENERATOR_PLATFORM=x64 -DMSHIO_BUILD_TESTS=On -DMSHIO_BUILD_EXAMPLES=On
        cmake --build . --config Release
        ctest
