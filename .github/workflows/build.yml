name: build and test

on: [pull_request]

jobs:
  build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: build and run
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DMSHIO_BUILD_TESTS=On -DMSHIO_BUILD_EXAMPLES=On
        make -j
        ctest --output-on-failure

    - name: install Gmsh shared-library dependencies
      run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

    - name: build and test Python package
      run: |
        python -m pip install '.[test]'
        python -m pytest tests

  build-MacOS:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: build and run
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DMSHIO_BUILD_TESTS=On -DMSHIO_BUILD_EXAMPLES=On
        make -j
        ctest

  build-Windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: build and run
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_GENERATOR_PLATFORM=x64 -DMSHIO_BUILD_TESTS=On -DMSHIO_BUILD_EXAMPLES=On
        cmake --build . --config Release
        ctest
